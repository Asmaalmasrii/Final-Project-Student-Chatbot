<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPU CHAT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">
    <div class="layout">
      <!-- Left Panel -->
      <div class="left-panel card"
        style="display: flex; flex-direction: column; height: calc(100% - 14px); margin-top: 14px;">
        <!-- Title Header -->
        <div class="topbar" style="justify-content: center; gap: 10px; padding: 10px 14px 0 14px; border-bottom: none;">
          <img src="kcLogo.png" alt="logo" />
          <div class="title">
            <h1>KPU CHAT</h1>
          </div>
        </div>

        <!-- History/Account Header -->
        <div class="card-head" id="midHeader"
          style="position: relative; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);">
          <div class="status" style="position: static; margin: 0; display: flex; align-items: center; gap: 10px;">
            <button id="accountToggleBtn" class="btn"
              style="padding: 6px 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"
              title="Account Menu">
              <svg style="width:20px; height:20px; display:block;" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </button>
            <button id="logoutBtn" class="btn btn-danger" style="display:none;">Logout</button>
          </div>

          <button id="newChatBtn" class="btn btn-new-chat">+ New Chat</button>

          <!-- Account Dropdown Container -->
          <div id="accountDropdownContainer" class="card account-dropdown"
            style="position: absolute; left: 14px; top: calc(100% + 14px); display: none; z-index: 100; width: 320px; text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,0.15);">
            <div class="card-head" id="accountMenu">
              <strong>Account</strong>
              <div class="tabs">
                <button id="tabLogin" class="tab active" type="button">Login</button>
                <button id="tabSignup" class="tab" type="button">Sign up</button>
              </div>
            </div>

            <div class="card-body">
              <!-- Login Form -->
              <div id="loginPane">
                <div class="field">
                  <label for="loginEmail">Email</label>
                  <input id="loginEmail" type="email" placeholder="you@kpu.ca" />
                </div>
                <div class="field">
                  <label for="loginPassword">Password</label>
                  <input id="loginPassword" type="password" placeholder="••••••••" />
                </div>
                <button id="loginBtn" class="btn btn-primary" style="width:100%;">Login</button>
              </div>

              <!-- Signup Form -->
              <div id="signupPane" style="display:none;">
                <div class="field">
                  <label for="signupName">Full name (optional)</label>
                  <input id="signupName" type="text" placeholder="Asmaa Almasri" />
                </div>
                <div class="field">
                  <label for="signupEmail">Email</label>
                  <input id="signupEmail" type="email" placeholder="you@kpu.ca" />
                </div>
                <div class="field">
                  <label for="signupPassword">Password</label>
                  <input id="signupPassword" type="password" placeholder="Choose a strong password" />
                </div>
                <button id="signupBtn" class="btn btn-primary" style="width:100%;">Create account</button>
              </div>

              <div id="okBox" class="ok"></div>
              <div id="errBox" class="error"></div>
            </div>
          </div>
        </div>

        <div id="historyPane" style="border-top: none;">
          <div id="historyList" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="note">Login to see past conversations.</div>
          </div>
        </div>
      </div>

      <!-- Chat -->
      <div class="window-chat"
        style="display: flex; flex-direction: column; flex: 1; height: 100%; min-height: 0; position: relative; width: 100%;">
        <span id="senderView" style="display: none;"></span>

        <div id="chat"></div>

        <div class="composer">
          <input id="message" placeholder="Ask Anything" autocomplete="off" />
          <!-- <button id="send" class="btn btn-primary">Send</button> -->
          <button id="send" class="btn btn-primary"><img src="send.png" alt="send" /></button>
        </div>
      </div>

      <!-- Auth card moved to dropdown -->
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
